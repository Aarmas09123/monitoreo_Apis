name: Monitoreo de Saldos 24/7

on:
  schedule:
    - cron: '0 13,22 * * *'
  workflow_dispatch:

# Cancela ejecuciones anteriores colgadas o en progreso si lanzas una nueva
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ejecutar-monitoreo:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Evita que se quede colgado indefinidamente si falla
    permissions:
      contents: write # Permite guardar el archivo de reportes en el repositorio

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Consultar APIs y generar reporte
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
      run: |
        python monitor_central.py

    - name: Enviar informe por correo (WorkMail)
      continue-on-error: true # Un fallo en el correo no detendrá el guardado de reportes
      env:
        WORKMAIL_USER: ${{ secrets.WORKMAIL_USER }}
        WORKMAIL_PASS: ${{ secrets.WORKMAIL_PASS }}
      run: |
        python enviar_correo.py

    - name: Commit y Push de reportes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Entradas/reporte_saldos.txt
        git commit -m "Actualizacion automatica de saldos [skip ci]" || exit 0
        git push origin main
