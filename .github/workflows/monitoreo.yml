name: Monitoreo de Saldos 24/7

on:
  schedule:
    - cron: '0 13,22 * * *'
  workflow_dispatch:

jobs:
  ejecutar-monitoreo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite a GitHub Actions guardar archivos en el repositorio

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Consultar APIs y generar reporte
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
      run: |
        python monitor_central.py
- name: Commit y Push de reportes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Entradas/reporte_saldos.txt
        git commit -m "Actualizacion automatica de saldos [skip ci]" || exit 0
        git push origin master
